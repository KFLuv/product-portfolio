server.port=8078
server.servlet.context-path=/chat

# ==================== AI 对话配置 ====================
# 留空 ai.api-key 时，/chat/Aichat 会自动退回本地模拟回复（功能不会挂）。
# 填上任意一家 OpenAI 兼容服务的 Key 并重启，就变成真实大模型回答。
#
# 常见免费/低价的 base-url 参考（key 和 model 名以各家控制台为准）：
#   智谱 GLM     https://open.bigmodel.cn/api/paas/v4        模型示例 glm-4.7-flash（免费）
#   讯飞星火     https://spark-api-open.xf-yun.com/v1        模型示例 lite / 4.0Ultra
#   硅基流动     https://api.siliconflow.cn/v1               模型示例 Qwen/Qwen2.5-7B-Instruct（免费）
#   阿里百炼     https://dashscope.aliyuncs.com/compatible-mode/v1
#   DeepSeek     https://api.deepseek.com
#
# 注意：api-key 属于私密信息，不要提交到公开仓库。
ai.base-url=https://api.deepseek.com
ai.api-key=
ai.model=deepseek-flash
