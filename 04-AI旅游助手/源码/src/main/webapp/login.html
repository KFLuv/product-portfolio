<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            transition: border 0.3s;
        }

        .form-group input:focus {
            border-color: #4a90e2;
            outline: none;
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-button:hover {
            background-color: #357abd;
        }

        .login-button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>用户登录</h1>
    </div>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">账号</label>
            <input type="text" id="username" name="username" placeholder="请输入账号">
            <div class="error-message" id="usernameError">账号不能为空</div>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码">
            <div class="error-message" id="passwordError">密码不能为空</div>
        </div>
        <div style="margin-bottom: 15px;">
            <input type="checkbox" name="rememberPassword" id="remember">记住密码
            <input type="checkbox" name="auto" id="autofill">自动登录
        </div>
        <button type="submit" class="login-button" id="loginBtn">登录</button>
        <p style="text-align:center; margin-top: 15px;">
            没有账号？<a href="reg.html">去注册</a>
        </p>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');
        const loginBtn = document.getElementById('loginBtn');
        const rememberInput = document.getElementById('remember'); // 记住密码
        const autofillInput = document.getElementById('autofill'); // 自动登录

        // 表单提交处理
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault(); // 阻止表单默认提交

            // 重置错误信息
            usernameError.style.display = 'none';
            passwordError.style.display = 'none';

            // 获取输入值
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            const remember = rememberInput.value.trim();
            const autofill = autofillInput.value.trim();

            // 验证输入
            let isValid = true;

            if (!username) {
                usernameError.style.display = 'block';
                isValid = false;
            }

            if (!password) {
                passwordError.style.display = 'block';
                isValid = false;
            }

            if (!isValid) {
                return;
            }

            // 禁用登录按钮防止重复提交
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';

            // 发送登录请求
            fetch('/chat/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    username: username,
                    password: password,
                    remember: remember,
                    auto: autofill
                }).toString()
            })
                .then(response => {
                    if (response.redirected) {// 是否重定向
                        //alert(response.url);
                        window.location.href = response.url;
                    } else {
                        return response.text();
                    }
                })
                .then(data => { // 这里的data 是上面的response.text() 内容
                    if (data) {
                        alert('登录失败: ' + data);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('登录过程中发生错误');
                })
                .finally(() => {
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登录';
                });
        });

        // 输入框实时验证
        usernameInput.addEventListener('input', function() {
            if (this.value.trim()) {
                usernameError.style.display = 'none';
            }
        });

        passwordInput.addEventListener('input', function() {
            if (this.value.trim()) {
                passwordError.style.display = 'none';
            }
        });
    });
</script>
</body>
</html>
