<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>注册表单</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 表单容器 -->
<div class="form-container">
    <h2>用户注册</h2>

    <!-- 表单主体 -->
    <form action="/chat/reg" method="post" id="regForm">
        <!-- 用户名输入 -->
        <div class="form-group">
            <label for="username">用户名：</label>
            <input type="text" id="username" name="username">
            <span style="color: red" id="username-error-info"></span>
        </div>
        <!-- 密码输入 -->
        <div class="form-group">
            <label for="password">密码：</label>
            <input type="password" id="password" name="password" required>
            <span style="color: red" id="password-error-info"></span>
        </div>
        <!-- 邮箱输入 -->
        <div class="form-group">
            <label for="email">电子邮箱：</label>
            <input type="email" id="email" name="email" required>
            <span style="color: red" id="email-error-info"></span>
        </div>
        <!-- 验证码部分 -->
        <div class="form-group">
            <label for="captcha">验证码：</label>
            <input type="text" id="captcha" name="captcha" required>
            <img src="/chat/captcha" id="captchaImage" onclick="refreshCaptcha()" style="cursor: pointer;" title="点击刷新验证码">
            <span style="color: red" id="captcha-error-info"></span>
        </div>
        <!-- 提交按钮 -->
        <div class="form-group">
            <button type="submit" onclick="check()">立即注册</button>
        </div>
    </form>
</div>
</body>
</html>
<script>
    // 校验表单，通过返回true,不通过false
    function check(){
        // 获取输入框的值
        var username = document.getElementById("username").value;
        if (username == "" || username == undefined || username.length <6){
            // 获取消息提示的span 节点，然后设置属性innerText值
            document.getElementById("username-error-info").innerText = '用户名需大于6位';
            return false;
        }else {
            document.getElementById("username-error-info").innerText = '';
            return true;
        }
    }
    const form = document.getElementById("regForm");
    form.addEventListener("submit",function (e){
        if (check()){
            form.submit();// 校验通过后提交表单
        }else {
            alert('校验不通过');
            e.preventDefault(); // 校验不通过，阻止提交
        }

    })

    // 刷新验证码
    function refreshCaptcha() {
        document.getElementById('captchaImage').src = '/chat/captcha?t=' + new Date().getTime();
    }
</script>
